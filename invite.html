<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>История</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --night:      #170f2e;
    --night-2:    #2c1b52;
    --night-deep: #0a0714;
    --moon:       #f3e3a8;
    --cream:      #f6f0e2;
    --magic:      #7fe3c9;
    --magic-dim:  #4f9e8c;
    --rose:       #e79ab0;
    --skin:       #f0c9a0;
    --hair:       #5c3a2e;
    --dress:      #8a6fb0;
    --dress-dark: #6e5591;
    --book-cover: #1f4f47;
    --book-pages: #f6f0e2;
  }

  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--night-deep);
    overflow:hidden;
    font-family:'Jost', sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }

  #stage{
    position:relative; width:100%; height:100dvh;
    background: linear-gradient(180deg, var(--night) 0%, var(--night-2) 55%, var(--night-deep) 100%);
  }

  .layer{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity 0.9s ease;
  }
  .layer.show{ opacity:1; pointer-events:auto; }

  /* ---------------- звёзды / светлячки ---------------- */
  .star{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background: var(--moon); opacity:0.5;
    animation: twinkle 3.6s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(1); }
    50%{ opacity:0.9; transform:scale(1.7); }
  }
  .firefly{
    position:absolute; width:4px; height:4px; border-radius:50%;
    background: var(--magic);
    box-shadow: 0 0 8px 2px rgba(127,227,201,0.7);
    animation: drift 6s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ transform: translate(0,0); opacity:0.4; }
    50%{ transform: translate(8px,-14px); opacity:1; }
  }

  /* ---------------- сцена 1: девушка с книгой ---------------- */
  #scene-open{ opacity:1; pointer-events:auto; flex-direction:column; }

  .illustration{ width:min(72vw, 300px); }

  .tap-hint{
    margin-top: 26px;
    color: var(--moon);
    font-size:12px; letter-spacing:0.22em; text-transform:uppercase;
    opacity:0.65;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:0.3;} 50%{opacity:0.8;} }

  /* ---------------- диалог ---------------- */
  #dialog-overlay{ align-items:flex-end; }
  #dialog-overlay .backdrop{
    position:absolute; inset:0; background: rgba(10,7,20,0.55);
  }
  .dialog-card{
    position:relative;
    width:100%;
    background: linear-gradient(170deg, #211441, #150c2c);
    border-top: 1px solid rgba(243,227,168,0.25);
    border-radius: 22px 22px 0 0;
    padding: 30px 26px 34px;
    text-align:center;
    transform: translateY(100%);
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
  }
  #dialog-overlay.show .dialog-card{ transform: translateY(0); }

  .dialog-text{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(19px, 5.6vw, 23px);
    color: var(--cream);
    line-height:1.5;
    margin: 0 0 24px;
  }

  .dlg-actions{ display:flex; flex-direction:column; gap:10px; }
  .btn{
    border:none; border-radius:30px; padding:14px 18px;
    font-family:'Jost', sans-serif; font-size:14px;
    letter-spacing:0.05em; cursor:pointer;
    transition: transform 0.15s ease, opacity 0.2s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{
    background: linear-gradient(135deg, var(--magic), var(--magic-dim));
    color: var(--night-deep);
    font-weight:500;
  }
  .btn-secondary{
    background: transparent;
    color: var(--cream);
    opacity:0.6;
  }

  /* ---------------- сцена 2: книга открывается + кролик ---------------- */
  #scene-transition .book-wrap{ position:relative; width:min(60vw,240px); }

  .glow-burst{
    position:absolute; left:50%; top:50%;
    width:20px; height:20px;
    transform: translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(circle, rgba(127,227,201,0.9), transparent 70%);
    animation: burst 1.6s ease-out forwards;
  }
  @keyframes burst{
    0%{ width:20px; height:20px; opacity:0.9; }
    100%{ width:340px; height:340px; opacity:0; }
  }

  .rabbit{
    position:absolute; bottom:8%; left:-10%;
    width:52px;
    animation: hop 1.8s ease-in-out forwards;
    animation-delay: 0.5s;
    opacity:0;
  }
  @keyframes hop{
    0%{ opacity:0; left:-10%; transform: translateY(0); }
    10%{ opacity:1; }
    30%{ transform: translateY(-16px); }
    45%{ transform: translateY(0); }
    65%{ transform: translateY(-16px); }
    80%{ transform: translateY(0); }
    100%{ opacity:1; left:78%; transform: translateY(0); }
  }

  /* ---------------- сцена 3: падение в нору ---------------- */
  #scene-fall{ overflow:hidden; }
  .tunnel{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    animation: spin 7s linear infinite;
  }
  @keyframes spin{ from{ transform:rotate(0); } to{ transform:rotate(360deg); } }

  .ring{
    position:absolute;
    border-radius:50%;
    border: 2px solid var(--magic);
    opacity:0;
    animation: ripple 1.6s ease-out infinite;
  }
  @keyframes ripple{
    0%{ width:20px; height:20px; opacity:0.9; border-color: var(--moon); }
    60%{ opacity:0.35; }
    100%{ width:600px; height:600px; opacity:0; border-color: var(--magic); }
  }

  .fall-item{
    position:absolute; left:50%; top:50%;
    width:34px; opacity:0;
    transform: translate(-50%,-50%) scale(0.2);
  }
  .fall-item.launch{
    animation: fall 2.1s cubic-bezier(.3,.2,.4,1) forwards;
  }
  @keyframes fall{
    0%{ opacity:0; transform: translate(-50%,-50%) scale(0.15) rotate(0deg); }
    12%{ opacity:1; }
    100%{
      opacity:0;
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(2.6) rotate(var(--rot));
    }
  }

  /* ---------------- сцена 4: финал ---------------- */
  #scene-final{
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    text-align:center;
    padding: 6vh 9vw 5vh;
  }
  .final-illustration{
    width:min(40vw, 160px);
    margin-bottom: 22px;
    flex-shrink: 0;
  }
  .final-text{
    font-family:'Cormorant Garamond', serif;
    font-size: clamp(22px, 6.6vw, 30px);
    color: var(--cream);
    line-height:1.5;
    margin: 0 0 14px;
  }
  .final-sub{
    font-family:'Jost', sans-serif;
    font-size: 13px;
    letter-spacing:0.08em;
    color: var(--magic);
    opacity:0.85;
    margin: 0;
  }
  .btn-close{
    background: transparent;
    border: 1px solid rgba(246,240,226,0.35);
    color: var(--cream);
    border-radius: 30px;
    padding: 14px 40px;
    min-width: 160px;
    font-family:'Jost', sans-serif;
    font-size: 14px;
    letter-spacing:0.06em;
    white-space: nowrap;
    cursor:pointer;
    margin-top: auto;
    flex-shrink: 0;
  }

</style>
</head>
<body>

<div id="stage">

  <div id="scene-open" class="layer show">
    <svg class="illustration" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
      <!-- луна -->
      <circle cx="320" cy="80" r="34" fill="#f3e3a8" opacity="0.9"/>
      <circle cx="320" cy="80" r="52" fill="#f3e3a8" opacity="0.12"/>

      <!-- дерево -->
      <path d="M40 420 C 36 340 60 280 70 220 C 78 260 90 300 82 360 C 100 300 96 250 112 200 C 108 260 118 310 100 400 Z" fill="#0f0a20"/>
      <circle cx="70" cy="190" r="55" fill="#150c2c"/>
      <circle cx="30" cy="220" r="42" fill="#150c2c"/>
      <circle cx="110" cy="230" r="46" fill="#150c2c"/>

      <!-- земля -->
      <path d="M0 470 Q 100 440 200 468 T 400 462 L 400 600 L 0 600 Z" fill="#0a0714"/>

      <!-- девушка -->
      <g transform="translate(200,0)">
        <!-- скрещенные ноги -->
        <ellipse cx="0" cy="470" rx="92" ry="34" fill="var(--dress-dark)"/>
        <!-- юбка/торс -->
        <path d="M-58 380 C -66 430 -62 460 0 466 C 62 460 66 430 58 380 C 40 340 -40 340 -58 380 Z" fill="var(--dress)"/>
        <!-- рукава -->
        <path d="M-46 388 C -62 404 -60 424 -38 432" stroke="var(--dress)" stroke-width="16" fill="none" stroke-linecap="round"/>
        <path d="M46 388 C 62 404 60 424 38 432" stroke="var(--dress)" stroke-width="16" fill="none" stroke-linecap="round"/>
        <!-- кисти рук -->
        <circle cx="-40" cy="428" r="8" fill="var(--skin)"/>
        <circle cx="40" cy="428" r="8" fill="var(--skin)"/>
        <!-- голова -->
        <circle cx="0" cy="320" r="34" fill="var(--skin)"/>
        <!-- румянец -->
        <ellipse cx="15" cy="332" rx="6" ry="4" fill="var(--rose)" opacity="0.55"/>
        <!-- ресница/взгляд вниз (читает книгу) -->
        <path d="M6 322 q7 5 14 0" stroke="var(--hair)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <!-- волосы -->
        <path d="M-34 312 C -46 280 -20 250 0 250 C 22 250 48 280 34 314
                 C 40 360 30 420 6 452 C 0 420 -4 400 -10 452 C -34 420 -42 360 -34 312 Z" fill="var(--hair)"/>
        <path d="M-30 300 C -20 288 20 288 30 300" stroke="#4a2e24" stroke-width="3" fill="none" opacity="0.6"/>
        <!-- книга (крупная, хорошо видна в руках) -->
        <g transform="translate(0,426)">
          <path d="M-58 -8 L -6 -18 L -6 30 L -58 42 Z" fill="var(--book-pages)"/>
          <path d="M58 -8 L 6 -18 L 6 30 L 58 42 Z" fill="var(--book-pages)"/>
          <path d="M-6 -18 L 6 -18 L 6 30 L -6 30 Z" fill="var(--book-cover)"/>
          <path d="M-48 0 L -14 -8 M-48 10 L -14 2 M-48 20 L -14 12 M-48 30 L -20 24"
                stroke="#b9a879" stroke-width="1.5"/>
          <path d="M14 -8 L 48 0 M14 2 L 48 10 M14 12 L 48 20 M20 24 L 48 30"
                stroke="#b9a879" stroke-width="1.5"/>
          <path d="M0 -18 L 0 40 L 4 34 L 8 40 L 8 -18" fill="var(--rose)" opacity="0.85"/>
        </g>
      </g>

      <!-- светлячки placeholder positions handled by JS -->
    </svg>
    <div class="tap-hint">нажми, чтобы начать историю</div>
  </div>

  <div id="dialog-overlay" class="layer">
    <div class="backdrop"></div>
    <div class="dialog-card">
      <p class="dialog-text">Хотите узнать,<br>что скрывается за страницами этого рассказа?</p>
      <div class="dlg-actions">
        <button class="btn btn-primary" id="btn-yes">Да, хочу</button>
        <button class="btn btn-secondary" id="btn-later">Ещё не сейчас</button>
      </div>
    </div>
  </div>

  <div id="scene-transition" class="layer">
    <div class="book-wrap">
      <div class="glow-burst"></div>
      <svg viewBox="0 0 240 160" width="100%">
        <path d="M120 20 L20 40 L20 140 L120 130 Z" fill="#f6f0e2" opacity="0.94"/>
        <path d="M120 20 L220 40 L220 140 L120 130 Z" fill="#efe2c8" opacity="0.94"/>
        <path d="M30 55 L100 45 M30 75 L100 68 M30 95 L100 90 M30 115 L92 110" stroke="#b9a879" stroke-width="1.6"/>
        <path d="M140 45 L210 55 M148 68 L210 75 M148 90 L210 95 M156 110 L210 115" stroke="#b9a879" stroke-width="1.6"/>
      </svg>
      <svg class="rabbit" viewBox="0 0 60 60">
        <ellipse cx="30" cy="42" rx="16" ry="12" fill="#f6f0e2"/>
        <circle cx="18" cy="26" r="10" fill="#f6f0e2"/>
        <path d="M12 18 C 8 4 16 2 18 16" fill="#f6f0e2"/>
        <path d="M22 16 C 24 2 32 4 26 18" fill="#f6f0e2"/>
        <circle cx="15" cy="25" r="1.6" fill="#150c2c"/>
        <ellipse cx="44" cy="46" rx="5" ry="4" fill="#f6f0e2"/>
      </svg>
    </div>
  </div>

  <div id="scene-fall" class="layer">
    <div class="tunnel" id="tunnel"></div>
    <svg class="fall-item" id="item-key" viewBox="0 0 24 24" style="--dx:-120px; --dy:160px; --rot:220deg;">
      <circle cx="7" cy="7" r="5" fill="none" stroke="#f3e3a8" stroke-width="1.6"/>
      <path d="M11 11 L21 21 M16 16 L19 13 M18 18 L21 15" stroke="#f3e3a8" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>
    <svg class="fall-item" id="item-watch" viewBox="0 0 24 24" style="--dx:130px; --dy:-140px; --rot:-260deg;">
      <circle cx="12" cy="13" r="8" fill="none" stroke="#f6f0e2" stroke-width="1.6"/>
      <path d="M12 8 L12 13 L16 15" stroke="#f6f0e2" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path d="M9 3 L15 3" stroke="#f6f0e2" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <svg class="fall-item" id="item-cup" viewBox="0 0 24 24" style="--dx:-150px; --dy:-120px; --rot:180deg;">
      <path d="M4 9 H16 V13 A6 6 0 0 1 4 13 Z" fill="none" stroke="#7fe3c9" stroke-width="1.6"/>
      <path d="M16 10 C 20 10 20 15 16 15" fill="none" stroke="#7fe3c9" stroke-width="1.6"/>
      <path d="M2 18 H18" stroke="#7fe3c9" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <svg class="fall-item" id="item-card" viewBox="0 0 24 24" style="--dx:150px; --dy:150px; --rot:320deg;">
      <rect x="5" y="2" width="14" height="20" rx="2" fill="none" stroke="#e79ab0" stroke-width="1.6"/>
      <circle cx="12" cy="12" r="2.4" fill="#e79ab0"/>
    </svg>
    <svg class="fall-item" id="item-feather" viewBox="0 0 24 24" style="--dx:0px; --dy:190px; --rot:140deg;">
      <path d="M12 2 C 4 8 4 18 12 22 C 10 15 10 8 12 2 Z" fill="#f3e3a8" opacity="0.9"/>
    </svg>
  </div>

  <div id="scene-final" class="layer">
    <svg class="illustration final-illustration" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
      <circle cx="320" cy="80" r="34" fill="#f3e3a8" opacity="0.9"/>
      <circle cx="320" cy="80" r="52" fill="#f3e3a8" opacity="0.12"/>
      <path d="M40 420 C 36 340 60 280 70 220 C 78 260 90 300 82 360 C 100 300 96 250 112 200 C 108 260 118 310 100 400 Z" fill="#0f0a20"/>
      <circle cx="70" cy="190" r="55" fill="#150c2c"/>
      <circle cx="30" cy="220" r="42" fill="#150c2c"/>
      <circle cx="110" cy="230" r="46" fill="#150c2c"/>
      <path d="M0 470 Q 100 440 200 468 T 400 462 L 400 600 L 0 600 Z" fill="#0a0714"/>
      <g transform="translate(200,0)">
        <ellipse cx="0" cy="470" rx="92" ry="34" fill="var(--dress-dark)"/>
        <path d="M-58 380 C -66 430 -62 460 0 466 C 62 460 66 430 58 380 C 40 340 -40 340 -58 380 Z" fill="var(--dress)"/>
        <path d="M-46 388 C -62 404 -60 424 -38 432" stroke="var(--dress)" stroke-width="16" fill="none" stroke-linecap="round"/>
        <path d="M46 388 C 62 404 60 424 38 432" stroke="var(--dress)" stroke-width="16" fill="none" stroke-linecap="round"/>
        <circle cx="-40" cy="428" r="8" fill="var(--skin)"/>
        <circle cx="40" cy="428" r="8" fill="var(--skin)"/>
        <circle cx="0" cy="320" r="34" fill="var(--skin)"/>
        <ellipse cx="15" cy="332" rx="6" ry="4" fill="var(--rose)" opacity="0.55"/>
        <path d="M6 322 q7 5 14 0" stroke="var(--hair)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M-34 312 C -46 280 -20 250 0 250 C 22 250 48 280 34 314
                 C 40 360 30 420 6 452 C 0 420 -4 400 -10 452 C -34 420 -42 360 -34 312 Z" fill="var(--hair)"/>
        <path d="M-30 300 C -20 288 20 288 30 300" stroke="#4a2e24" stroke-width="3" fill="none" opacity="0.6"/>
        <g transform="translate(0,426)">
          <path d="M-58 -8 L -6 -18 L -6 30 L -58 42 Z" fill="var(--book-pages)"/>
          <path d="M58 -8 L 6 -18 L 6 30 L 58 42 Z" fill="var(--book-pages)"/>
          <path d="M-6 -18 L 6 -18 L 6 30 L -6 30 Z" fill="var(--book-cover)"/>
          <path d="M-48 0 L -14 -8 M-48 10 L -14 2 M-48 20 L -14 12 M-48 30 L -20 24"
                stroke="#b9a879" stroke-width="1.5"/>
          <path d="M14 -8 L 48 0 M14 2 L 48 10 M14 12 L 48 20 M20 24 L 48 30"
                stroke="#b9a879" stroke-width="1.5"/>
          <path d="M0 -18 L 0 40 L 4 34 L 8 40 L 8 -18" fill="var(--rose)" opacity="0.85"/>
        </g>
      </g>
    </svg>
    <p class="final-text" id="final-text">В таком случае —<br>жду тебя в этой истории.</p>
    <p class="final-sub">Место и время пришлю следующим сообщением ✨</p>
    <button class="btn-close" id="btn-close">Хорошо</button>
  </div>

</div>

<script>
const stage = document.getElementById('stage');
for (let i = 0; i < 34; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 60 + '%';
  s.style.animationDelay = (Math.random() * 3.5) + 's';
  stage.appendChild(s);
}
for (let i = 0; i < 10; i++) {
  const f = document.createElement('div');
  f.className = 'firefly';
  f.style.left = (30 + Math.random() * 40) + '%';
  f.style.top = (55 + Math.random() * 30) + '%';
  f.style.animationDelay = (Math.random() * 5) + 's';
  stage.appendChild(f);
}

const tunnel = document.getElementById('tunnel');
for (let i = 0; i < 6; i++) {
  const r = document.createElement('div');
  r.className = 'ring';
  r.style.animationDelay = (i * 0.32) + 's';
  tunnel.appendChild(r);
}

let tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setBackgroundColor('#170f2e'); } catch(e) {}
  try { tg.setHeaderColor('#170f2e'); } catch(e) {}
}

const sceneOpen = document.getElementById('scene-open');
const dialog = document.getElementById('dialog-overlay');
const sceneTransition = document.getElementById('scene-transition');
const sceneFall = document.getElementById('scene-fall');
const sceneFinal = document.getElementById('scene-final');

sceneOpen.addEventListener('click', () => {
  if (dialog.classList.contains('show')) return;
  dialog.classList.add('show');
});

document.getElementById('btn-later').addEventListener('click', (e) => {
  e.stopPropagation();
  dialog.classList.remove('show');
});

document.getElementById('btn-yes').addEventListener('click', (e) => {
  e.stopPropagation();
  dialog.classList.remove('show');
  sceneOpen.classList.remove('show');
  sceneTransition.classList.add('show');

  setTimeout(() => {
    sceneTransition.classList.remove('show');
    sceneFall.classList.add('show');
    document.querySelectorAll('.fall-item').forEach((el, idx) => {
      setTimeout(() => el.classList.add('launch'), idx * 380);
    });
  }, 1900);

  setTimeout(() => {
    sceneFall.classList.remove('show');
    sceneFinal.classList.add('show');
    if (tg && tg.sendData) {
      tg.sendData(JSON.stringify({ action: 'accepted', ts: Date.now() }));
    }
  }, 4400);
});

document.getElementById('btn-close').addEventListener('click', () => {
  // возвращаем всё в исходное состояние, чтобы историю можно было посмотреть заново
  sceneFinal.classList.remove('show');
  sceneFall.classList.remove('show');
  sceneTransition.classList.remove('show');
  dialog.classList.remove('show');

  document.querySelectorAll('.fall-item').forEach((el) => {
    el.classList.remove('launch');
  });

  sceneOpen.classList.add('show');
});
</script>

</body>
</html>
