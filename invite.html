<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>История</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --night:      #170f2e;
    --night-2:    #2c1b52;
    --night-deep: #0a0714;
    --moon:       #f3e3a8;
    --cream:      #f6f0e2;
    --magic:      #7fe3c9;
    --magic-dim:  #4f9e8c;
    --rose:       #e79ab0;
  }

  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--night-deep);
    overflow:hidden;
    font-family:'Jost', sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }

  #stage{
    position:relative; width:100%; height:100dvh;
    background: linear-gradient(180deg, var(--night) 0%, var(--night-2) 55%, var(--night-deep) 100%);
    overflow:hidden;
  }

  .layer{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity 0.9s ease;
  }
  .layer.show{ opacity:1; pointer-events:auto; }

  /* ---------------- звёзды / светлячки ---------------- */
  .star{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background: var(--moon); opacity:0.5;
    animation: twinkle 3.6s ease-in-out infinite;
    z-index: 5;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(1); }
    50%{ opacity:0.9; transform:scale(1.7); }
  }
  .firefly{
    position:absolute; width:4px; height:4px; border-radius:50%;
    background: var(--magic);
    box-shadow: 0 0 8px 2px rgba(127,227,201,0.7);
    animation: drift 6s ease-in-out infinite;
    z-index: 5;
  }
  @keyframes drift{
    0%,100%{ transform: translate(0,0); opacity:0.4; }
    50%{ transform: translate(8px,-14px); opacity:1; }
  }

  /* ---------------- сцена 1: фото девушки с книгой ---------------- */
  #scene-open{ opacity:1; pointer-events:auto; overflow:hidden; }

  .bg-photo{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    object-fit: cover;
    object-position: center 30%;
    transform-origin: 40% 69%;
    transition: transform 1.7s cubic-bezier(.4,.05,.3,1);
    will-change: transform;
  }
  .bg-photo.zooming{
    transform: scale(4.2);
  }

  .photo-overlay{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(10,7,20,0.15) 0%, rgba(10,7,20,0) 30%, rgba(10,7,20,0.55) 100%);
    pointer-events:none;
    transition: background 1.7s ease;
  }
  #scene-open.zoom-dark .photo-overlay{
    background: rgba(8,5,16,0.88);
  }

  .tap-hint{
    position:absolute;
    left:0; right:0; bottom:7%;
    text-align:center;
    color: var(--cream);
    font-size:12px; letter-spacing:0.22em; text-transform:uppercase;
    opacity:0.8;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:0.4;} 50%{opacity:0.9;} }

  /* ---------------- диалог ---------------- */
  #dialog-overlay{ align-items:flex-end; }
  #dialog-overlay .backdrop{
    position:absolute; inset:0; background: rgba(10,7,20,0.55);
  }
  .dialog-card{
    position:relative;
    width:100%;
    background: linear-gradient(170deg, #211441, #150c2c);
    border-top: 1px solid rgba(243,227,168,0.25);
    border-radius: 22px 22px 0 0;
    padding: 30px 26px 34px;
    text-align:center;
    transform: translateY(100%);
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
  }
  #dialog-overlay.show .dialog-card{ transform: translateY(0); }

  .dialog-text{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(19px, 5.6vw, 23px);
    color: var(--cream);
    line-height:1.5;
    margin: 0 0 24px;
  }

  .dlg-actions{ display:flex; flex-direction:column; gap:10px; }
  .btn{
    border:none; border-radius:30px; padding:14px 18px;
    font-family:'Jost', sans-serif; font-size:14px;
    letter-spacing:0.05em; cursor:pointer;
    transition: transform 0.15s ease, opacity 0.2s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{
    background: linear-gradient(135deg, var(--magic), var(--magic-dim));
    color: var(--night-deep);
    font-weight:500;
  }
  .btn-secondary{
    background: transparent;
    color: var(--cream);
    opacity:0.6;
  }

  /* ---------------- сцена 2: переход + кролик ---------------- */
  .glow-burst{
    position:absolute; left:50%; top:50%;
    width:20px; height:20px;
    transform: translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(circle, rgba(127,227,201,0.9), transparent 70%);
    opacity: 0;
  }
  .glow-burst.launch{
    animation: burst 1.6s ease-out forwards;
  }
  @keyframes burst{
    0%{ width:20px; height:20px; opacity:0.9; }
    100%{ width:340px; height:340px; opacity:0; }
  }

  .rabbit{
    position:absolute; bottom:34%; left:-18%;
    width:120px;
    opacity: 0;
  }
  .rabbit.launch{
    animation: hop 2.1s cubic-bezier(.35,.1,.3,1) forwards;
  }
  @keyframes hop{
    0%{ opacity:0; left:-18%; transform: translateY(0) scale(1); }
    8%{ opacity:1; }
    22%{ transform: translateY(-22px) scale(1); }
    36%{ transform: translateY(0) scale(1); left:14%; }
    50%{ transform: translateY(-22px) scale(1); left:26%; }
    64%{ transform: translateY(0) scale(1); left:38%; }
    80%{ transform: translateY(-14px) scale(0.75); left:47%; opacity:1; }
    100%{ transform: translateY(0) scale(0.08); left:50%; opacity:0; }
  }
  .rabbit-leg{
    animation: run-leg 0.22s ease-in-out infinite;
    transform-origin: center;
  }
  .rabbit-leg-back{ animation-delay: 0s; }
  .rabbit-leg-front{ animation-delay: 0.11s; }
  @keyframes run-leg{
    0%,100%{ transform: translateY(0) scaleY(1); }
    50%{ transform: translateY(-5px) scaleY(0.65); }
  }
  .speed-line{
    stroke: #f6f0e2;
    stroke-width: 2;
    stroke-linecap: round;
    opacity: 0;
  }
  .speed-line.launch{
    animation: speed-fade 2.1s ease-out forwards;
  }
  .speed-line.l2.launch{ animation-delay: 0.15s; }
  .speed-line.l3.launch{ animation-delay: 0.3s; }
  @keyframes speed-fade{
    0%,15%{ opacity:0; }
    25%{ opacity:0.5; }
    45%{ opacity:0; }
    100%{ opacity:0; }
  }

  /* ---------------- сцена 3: падение в нору ---------------- */
  #scene-fall{ overflow:hidden; }
  .tunnel{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    animation: spin 7s linear infinite;
  }
  @keyframes spin{ from{ transform:rotate(0); } to{ transform:rotate(360deg); } }

  .ring{
    position:absolute;
    border-radius:50%;
    border: 2px solid var(--magic);
    opacity:0;
    animation: ripple 1.6s ease-out infinite;
  }
  @keyframes ripple{
    0%{ width:20px; height:20px; opacity:0.9; border-color: var(--moon); }
    60%{ opacity:0.35; }
    100%{ width:600px; height:600px; opacity:0; border-color: var(--magic); }
  }

  .fall-item{
    position:absolute; left:50%; top:50%;
    width:34px; opacity:0;
    transform: translate(-50%,-50%) scale(0.2);
  }
  .fall-item.launch{
    animation: fall 2.1s cubic-bezier(.3,.2,.4,1) forwards;
  }
  @keyframes fall{
    0%{ opacity:0; transform: translate(-50%,-50%) scale(0.15) rotate(0deg); }
    12%{ opacity:1; }
    100%{
      opacity:0;
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(2.6) rotate(var(--rot));
    }
  }

  /* ---------------- сцена 4: финал ---------------- */
  #scene-final{
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 6vh 9vw 6vh;
  }
  .final-text{
    font-family:'Cormorant Garamond', serif;
    font-size: clamp(24px, 7vw, 32px);
    color: var(--cream);
    line-height:1.5;
    margin: 0 0 14px;
  }
  .final-sub{
    font-family:'Jost', sans-serif;
    font-size: 13px;
    letter-spacing:0.08em;
    color: var(--magic);
    opacity:0.85;
    margin: 0;
  }
  .btn-close{
    background: transparent;
    border: 1px solid rgba(246,240,226,0.35);
    color: var(--cream);
    border-radius: 30px;
    padding: 14px 40px;
    min-width: 160px;
    font-family:'Jost', sans-serif;
    font-size: 14px;
    letter-spacing:0.06em;
    white-space: nowrap;
    cursor:pointer;
    margin-top: 48px;
    flex-shrink: 0;
  }

</style>
</head>

<script>
const stage = document.getElementById('stage');
for (let i = 0; i < 24; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 18 + '%';
  s.style.animationDelay = (Math.random() * 3.5) + 's';
  stage.appendChild(s);
}

const tunnel = document.getElementById('tunnel');
for (let i = 0; i < 6; i++) {
  const r = document.createElement('div');
  r.className = 'ring';
  r.style.animationDelay = (i * 0.32) + 's';
  tunnel.appendChild(r);
}

let tg = window.Telegram ? window.Telegram.WebApp : null;
alert('ДИАГНОСТИКА: tg = ' + (tg ? 'НАЙДЕН, версия ' + (tg.version || '?') : 'NULL (не найден)'));
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setBackgroundColor('#170f2e'); } catch(e) {}
  try { tg.setHeaderColor('#170f2e'); } catch(e) {}
}

const sceneOpen = document.getElementById('scene-open');
const bgPhoto = document.getElementById('bg-photo');
const dialog = document.getElementById('dialog-overlay');
const sceneTransition = document.getElementById('scene-transition');
const sceneFall = document.getElementById('scene-fall');
const sceneFinal = document.getElementById('scene-final');

sceneOpen.addEventListener('click', () => {
  if (dialog.classList.contains('show')) return;
  dialog.classList.add('show');
});

document.getElementById('btn-later').addEventListener('click', (e) => {
  e.stopPropagation();
  dialog.classList.remove('show');
});

document.getElementById('btn-yes').addEventListener('click', (e) => {
  e.stopPropagation();
  dialog.classList.remove('show');

  // приближаемся к книге в её руках и постепенно затемняем кадр
  bgPhoto.classList.add('zooming');
  sceneOpen.classList.add('zoom-dark');

  setTimeout(() => {
    sceneOpen.classList.remove('show');
    sceneTransition.classList.add('show');

    // запускаем кролика и вспышку именно сейчас, когда сцена реально видна
    document.querySelector('.glow-burst').classList.add('launch');
    document.querySelector('.rabbit').classList.add('launch');
    document.querySelectorAll('.speed-line').forEach((el) => el.classList.add('launch'));
  }, 1750);

  setTimeout(() => {
    sceneTransition.classList.remove('show');
    sceneFall.classList.add('show');
    document.querySelectorAll('.fall-item').forEach((el, idx) => {
      setTimeout(() => el.classList.add('launch'), idx * 380);
    });
  }, 4000);

  setTimeout(() => {
    sceneFall.classList.remove('show');
    sceneFinal.classList.add('show');

    alert('ДИАГНОСТИКА: дошли до отправки. tg=' + (tg ? 'есть' : 'НЕТ') + ', sendData=' + (tg && tg.sendData ? 'есть' : 'НЕТ'));

    if (tg && tg.sendData) {
      try {
        tg.sendData(JSON.stringify({ action: 'accepted', ts: Date.now() }));
        alert('ДИАГНОСТИКА: sendData вызван без ошибок');
      } catch (err) {
        alert('ДИАГНОСТИКА: ОШИБКА при sendData: ' + err.message);
      }
    }
  }, 6500);
});

document.getElementById('btn-close').addEventListener('click', () => {
  // возвращаем всё в исходное состояние, чтобы историю можно было посмотреть заново
  sceneFinal.classList.remove('show');
  sceneFall.classList.remove('show');
  sceneTransition.classList.remove('show');
  dialog.classList.remove('show');

  document.querySelectorAll('.fall-item').forEach((el) => {
    el.classList.remove('launch');
  });
  document.querySelector('.glow-burst').classList.remove('launch');
  document.querySelector('.rabbit').classList.remove('launch');
  document.querySelectorAll('.speed-line').forEach((el) => el.classList.remove('launch'));

  bgPhoto.classList.remove('zooming');
  sceneOpen.classList.remove('zoom-dark');
  sceneOpen.classList.add('show');
});
</script>

</body>
</html>
